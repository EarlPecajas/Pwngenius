<!doctype html>
<!-- pwngenius{y0u_f0und_1t} -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pwngenius</title>
  <link rel="icon" type="image/jpeg" href="images/pwngenius_logo.jpg" />
  <link rel="shortcut icon" type="image/jpeg" href="images/pwngenius_logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="PwnGenius home">
        <img class="brand-logo" src="images/pwngenius_logo.jpg" alt="" />
        <span>PWNGENIUS<span class="brand-slash">//</span>CTF</span>
      </a>
      <div id="account-actions" class="account-actions hidden">
        <button id="logout-button" class="text-button" type="button">LOG OUT</button>
      </div>
    </header>

    <p id="auth-loading" class="auth-loading">RESTORING SECURE SESSION...</p>
    <main class="auth-layout hidden">
      <section class="auth-intro">
        <p class="eyebrow"><span class="eyebrow-line"></span> SECURE ACCESS</p>
        <h1>Enter the<br /><em>arena.</em></h1>
        <p class="intro-text">Solve challenges. Climb the scoreboard.<br />Keep your signal secure.</p>
      </section>

      <section class="auth-card" aria-label="Account access">
        <div class="auth-tabs">
          <button class="auth-tab active" data-mode="login" type="button">LOGIN</button>
          <button class="auth-tab" data-mode="register" type="button">REGISTER</button>
        </div>

        <form id="login-form" class="auth-form">
          <label for="login-identifier">EMAIL OR USERNAME</label>
          <input id="login-identifier" required autocomplete="username" />
          <label for="login-password">PASSWORD</label>
          <input id="login-password" type="password" required autocomplete="current-password" />
          <button class="submit-button" type="submit"><span>ENTER SYSTEM</span><span>↗</span></button>
        </form>

        <form id="register-form" class="auth-form hidden">
          <label for="register-full-name">FULL NAME</label>
          <input id="register-full-name" required autocomplete="name" />
          <label for="register-username">USERNAME</label>
          <input id="register-username" required autocomplete="username" />
          <label for="register-email">EMAIL</label>
          <input id="register-email" type="email" required autocomplete="email" />
          <label for="register-password">PASSWORD</label>
          <input id="register-password" type="password" minlength="8" required autocomplete="new-password" />
          <label for="register-confirm">CONFIRM PASSWORD</label>
          <input id="register-confirm" type="password" minlength="8" required autocomplete="new-password" />
          <button class="submit-button" type="submit"><span>CREATE ACCOUNT</span><span>↗</span></button>
        </form>
        <p id="auth-status" class="form-status" role="status" aria-live="polite"></p>
      </section>
    </main>


    <footer><span>© 2026 PWNGENIUS//CTF</span><span class="footer-center">BUILT FOR THE CURIOUS</span></footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
