<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PwnGenius | Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="/">PWNGENIUS<span class="brand-slash">//</span>ADMIN</a>
      <button id="logout-button" class="text-button" type="button">LOG OUT</button>
    </header>
    <main id="admin-login" class="auth-layout">
      <section class="auth-intro">
        <p class="eyebrow"><span class="eyebrow-line"></span> RESTRICTED ACCESS</p>
        <h1>Admin<br /><em>control.</em></h1>
        <p class="intro-text">Manage players and publish challenges<br />from the secure control room.</p>
      </section>
      <section class="auth-card">
        <form id="admin-login-form" class="auth-form">
          <label for="admin-identifier">EMAIL OR USERNAME</label>
          <input id="admin-identifier" required autocomplete="username" />
          <label for="admin-password">PASSWORD</label>
          <input id="admin-password" type="password" required autocomplete="current-password" />
          <button class="submit-button" type="submit"><span>ACCESS CONTROL ROOM</span><span>↗</span></button>
        </form>
        <p id="admin-login-status" class="form-status" role="status"></p>
      </section>
    </main>
    <main id="admin-dashboard" class="admin-layout hidden">
      <section>
        <p class="eyebrow"><span class="eyebrow-line"></span> CONTROL ROOM</p>
        <h1>Build the<br /><em>arena.</em></h1>
        <form id="challenge-form" class="admin-form">
          <label>CHALLENGE TITLE</label><input name="title" required />
          <label>CATEGORY</label><input name="category" placeholder="Web, Crypto, Forensics..." required />
          <label>DIFFICULTY</label><input name="difficulty" placeholder="Beginner, Intermediate..." required />
          <label>DESCRIPTION</label><textarea name="description" required></textarea>
          <label>HINT</label><textarea name="hint" required></textarea>
          <label>FLAG (PRIVATE)</label><input name="flag" required />
          <label>POINTS</label><input name="points" type="number" min="1" value="100" required />
          <button class="submit-button" type="submit"><span>PUBLISH CHALLENGE</span><span>↗</span></button>
          <p id="challenge-status" class="form-status" role="status"></p>
        </form>
      </section>
      <section>
        <div class="section-heading"><span>01</span><h2>REGISTERED PLAYERS</h2><span class="heading-rule"></span></div>
        <div id="user-list" class="user-list"></div>
      </section>
      <section class="admin-challenges">
        <div class="section-heading"><span>02</span><h2>MANAGE CHALLENGES</h2><span class="heading-rule"></span></div>
        <div id="admin-challenge-list" class="user-list"></div>
      </section>
    </main>
    <footer><span>© 2026 PWNGENIUS//CTF</span><span class="footer-center">PRIVATE ADMIN AREA</span></footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
